# --- Keys & Prefix ---
unbind C-b
set -g prefix C-a

# vi mode
setw -g mode-keys vi

# --- Splits ---
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# --- Indexing ---
set -g base-index 1
set -g pane-base-index 1

# --- Mouse ---
set -g mouse on

# --- Window & Sessions ---
set-option -g allow-rename off
bind M-c attach-session -c "#{pane_current_path}"

# reload config
bind-key r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Colors ---
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"

# --- Clipboard & Copy ---
set -g set-clipboard on
bind-key c copy-mode
bind-key p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
set -g mode-style "fg=#D8DEE9,bg=#2E3440"

# --- Navigation ---
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n M-L next-window
bind -n M-H previous-window

bind -n M-J switch-client -p
bind -n M-K switch-client -n

# --- Status Bar ---
set -g status-bg '#1e1e2e'
set -g status-fg '#c1c1c1'
set -g window-status-format "#[fg=#c1c1c1,bg=#1e1e2e] #I #W "
set -g window-status-current-format "#[fg=#151515,bg=#6E85B2] #I #W "
set -g status-right '#[fg=#151515,bg=#6E85B2] %d/%m %H:%M '
set -g status-left '#[fg=#151515,bg=#6E85B2] #S '
set -g message-command-style "fg=#D8DEE9,bg=#2E3440"
set -g message-style "fg=#D8DEE9,bg=#2E3440"

# custom
set-option -g default-shell /usr/bin/zsh

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin options
set -g @continuum-restore 'on'
set -g @resurrect-processes 'ssh nvim htop'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep last)
run '~/.tmux/plugins/tpm/tpm'

